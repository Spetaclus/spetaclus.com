<!DOCTYPE html>
<html lang="no">
<head>

  <link rel="icon" href="/spectacle/assets/img/favicon.svg" type="image/svg+xml">

  <style>
    .feilside {
      min-height: 100vh;

<body>
  <div class="feilside">
    <div>
      <img src="/spectacle/assets/img/spectacle-symbol-hvit-glans.svg" alt="Spectacle">
      <h1>Fant ikke siden<span class="punktum">.</span></h1>
      <p>Siden du leter etter finnes ikke — men oversikten gjør det.</p>
      <a class="knapp knapp--messing" href="/spectacle/">Til forsiden</a>

  </div>
